name: FinOptima

options:
  bundleIdPrefix: com.minerva108
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: tr
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  FinOptima:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinOptima
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minerva108.finoptima
        PRODUCT_NAME: FinOptima
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FinOptima
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: FinOptima/Info.plist
      properties:
        CFBundleDisplayName: FinOptima
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSFaceIDUsageDescription: "Hesabına güvenli erişim için Face ID"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
